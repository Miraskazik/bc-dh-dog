spring:
  application:
    name: bc-dh-dog
  datasource:
    url: ${DOG_DB_URL:jdbc:postgresql://localhost:5434/dog}
    username: ${DOG_DB_USER:dog}
    password: ${DOG_DB_PASSWORD:dog}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # schéma vlastní Flyway
    properties:
      hibernate:
        jdbc.batch_size: 50
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true   # RFC 9457 pro chybové odpovědi
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://keycloak:8090/realms/dog-hotel}

server:
  port: ${SERVER_PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
